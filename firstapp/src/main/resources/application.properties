spring.application.name=firstapp
server.port=8080
# ── MySQL Database ────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/businessapp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sometimes@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool ──────────────────────────────────
# HikariCP is Spring Boot's default connection pool
# These settings are CRITICAL for production performance

# Maximum number of connections in the pool
# Formula: (cores * 2) + effective_spindle_count
# For your Dell laptop with 4 cores: (4 * 2) + 1 = 9 ≈ 10
spring.datasource.hikari.maximum-pool-size=10

# Minimum idle connections maintained in pool
# Keep at least 5 ready to serve requests immediately
spring.datasource.hikari.minimum-idle=5

# How long to wait for a connection from pool (ms)
# 20 seconds — if pool exhausted, wait this long before exception
spring.datasource.hikari.connection-timeout=20000

# How long a connection can sit idle before being removed (ms)
# 10 minutes — removes stale connections
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime of a connection (ms)
# 30 minutes — forces connection renewal to prevent stale connections
spring.datasource.hikari.max-lifetime=1800000

# Test query to validate connection is alive
spring.datasource.hikari.connection-test-query=SELECT 1

# Pool name — visible in logs and monitoring
spring.datasource.hikari.pool-name=BusinessAppHikariPool

# ── JPA / Hibernate ───────────────────────────────────────────
# update = creates/updates tables from entities automatically
# validate = use in production (schema must match entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable open-in-view — prevents accidental lazy loading
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
# Generate with: openssl rand -base64 64
# In production: use environment variable ${JWT_SECRET}
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 86400000ms = 24 hours
jwt.expiration=86400000

# ── Logging ───────────────────────────────────────────────────
logging.level.com.businessapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=DEBUG
