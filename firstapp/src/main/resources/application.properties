# ── Multipart / File Upload ───────────────────────────────────
# THESE WERE MISSING from what you showed me earlier — without
# them, Spring's defaults (1MB per file, 10MB total request) will
# silently reject any real phone photo before it even reaches your
# controller's own 5MB check in the service layer above.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB

# ── Profile Photo Storage ─────────────────────────────────────
# app.upload.profile-photos-dir: where files physically live.
# Use an ABSOLUTE path in production, not a bare relative string
# like the AI-generated version had — "uploads/profiles/" resolves
# differently depending on the JVM's working directory at startup,
# which varies across how you deploy (IDE run vs java -jar vs
# systemd service vs Docker container).
app.upload.profile-photos-dir=${user.home}/businessapp/uploads/profiles

# app.upload.base-url: the externally-reachable base URL used to
# build public photo URLs. In dev this is your LAN IP; in
# production this becomes your real domain. Matches the same
# "runtime-configurable, not hardcoded" principle as your Flutter
# side's ServerConfig from earlier.
app.upload.base-url=http://192.168.1.5:8080

